name: Deploy Firebase Spark Rules

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate Firebase project
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID belum tersedia."
            exit 1
          fi
          printf '{"projects":{"default":"%s"}}\n' "$FIREBASE_PROJECT_ID" > .firebaserc

      - name: Install tools and run tests
        run: |
          npm install --no-audit --no-fund
          npm run test:core
          npm run audit:static

      - name: Verify Firestore ruleset version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'BUMI_MAKMUR_RULESET_VERSION=6.0.3' firestore.rules || {
            echo "::error::firestore.rules bukan ruleset v6.0.3 yang diharapkan."
            exit 1
          }
          echo "Firestore Rules v6.0.3 tervalidasi sebelum deploy."

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy Firestore rules and indexes only
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@14 deploy --project "$FIREBASE_PROJECT_ID" --only firestore:rules,firestore:indexes --non-interactive

      - name: Remove temporary Google credentials
        if: always()
        shell: bash
        run: rm -f gha-creds-*.json
