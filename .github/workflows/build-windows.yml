name: Build Bumi Makmur POS Desktop v6.4.2

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Mode build
        required: true
        default: windows-release
        type: choice
        options:
          - test-only
          - windows-release

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Core tests
        run: npm run test:core

      - name: Static audit
        run: npm run audit:static

      - name: Validate Firebase configuration for desktop release
        if: ${{ inputs.build_mode == 'windows-release' }}
        shell: pwsh
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORE_ID: ${{ secrets.VITE_FIREBASE_STORE_ID }}
          VITE_FIREBASE_STORE_CODE: ${{ secrets.VITE_FIREBASE_STORE_CODE }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
        run: |
          $required = @(
            'VITE_FIREBASE_API_KEY','VITE_FIREBASE_AUTH_DOMAIN','VITE_FIREBASE_PROJECT_ID',
            'VITE_FIREBASE_MESSAGING_SENDER_ID','VITE_FIREBASE_APP_ID',
            'VITE_FIREBASE_STORE_ID','VITE_FIREBASE_STORE_CODE'
          )
          foreach ($key in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) {
              Write-Error "$key belum diisi pada GitHub Secrets."
              exit 1
            }
          }

      - name: Compile Vite source in test-only mode
        if: ${{ inputs.build_mode == 'test-only' }}
        run: npm run build

      - name: Build Windows EXE and MSI without implicit publishing
        if: ${{ inputs.build_mode == 'windows-release' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORE_ID: ${{ secrets.VITE_FIREBASE_STORE_ID }}
          VITE_FIREBASE_STORE_CODE: ${{ secrets.VITE_FIREBASE_STORE_CODE }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
        # Publishing is handled only by the explicit GitHub CLI step below.
        run: npm run desktop:dist

      - name: Generate SHA-256 checksums and release metadata
        if: ${{ inputs.build_mode == 'windows-release' }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $files = Get-ChildItem release/windows -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $files) {
            Write-Error 'Installer EXE/MSI tidak ditemukan.'
            exit 1
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding utf8 release/windows/SHA256SUMS-Windows.txt
          Copy-Item RELEASE-NOTES-Bumi-Makmur-POS-v6.4.2.md release/windows/RELEASE-NOTES.md -Force

      - name: Upload Windows installers to Actions artifact
        if: ${{ inputs.build_mode == 'windows-release' }}
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: Bumi-Makmur-POS-Desktop-v6.4.2-Windows
          path: |
            release/windows/*.exe
            release/windows/*.msi
            release/windows/SHA256SUMS-Windows.txt
            release/windows/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 1

      - name: Publish Windows installers to GitHub Releases
        if: ${{ inputs.build_mode == 'windows-release' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          $notes = 'release/windows/RELEASE-NOTES.md'
          $title = "Bumi Makmur POS v$env:RELEASE_VERSION"

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --target $env:GITHUB_SHA --title $title --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release edit $tag --repo $repo --title $title --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $assets = @(
            Get-ChildItem release/windows -File |
              Where-Object { $_.Extension -in '.exe', '.msi', '.txt' } |
              Select-Object -ExpandProperty FullName
          )
          & gh release upload $tag @assets --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
