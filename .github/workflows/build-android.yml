name: Build Signed Android Hybrid Release

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Pilih test-only sebelum Firebase siap, atau full-release untuk APK/AAB bertanda tangan
        required: true
        default: test-only
        type: choice
        options:
          - test-only
          - full-release

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run core tests
        run: npm run test:core

      - name: Stop after tests
        if: ${{ inputs.run_mode == 'test-only' }}
        run: echo "Core tests passed. Firebase secrets and signing are not required in test-only mode."

      - name: Setup Java
        if: ${{ inputs.run_mode == 'full-release' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Firebase build configuration
        if: ${{ inputs.run_mode == 'full-release' }}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORE_ID: ${{ secrets.VITE_FIREBASE_STORE_ID }}
          VITE_FIREBASE_STORE_CODE: ${{ secrets.VITE_FIREBASE_STORE_CODE }}
          VITE_FIREBASE_FUNCTIONS_REGION: ${{ secrets.VITE_FIREBASE_FUNCTIONS_REGION }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID VITE_FIREBASE_STORE_ID VITE_FIREBASE_STORE_CODE
            VITE_FIREBASE_FUNCTIONS_REGION VITE_PUBLIC_APP_URL
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key belum diisi pada Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          cat > .env.production <<ENVFILE
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_FIREBASE_STORE_ID=$VITE_FIREBASE_STORE_ID
          VITE_FIREBASE_STORE_CODE=$VITE_FIREBASE_STORE_CODE
          VITE_FIREBASE_FUNCTIONS_REGION=$VITE_FIREBASE_FUNCTIONS_REGION
          VITE_PUBLIC_APP_URL=$VITE_PUBLIC_APP_URL
          ENVFILE

      - name: Build web application
        if: ${{ inputs.run_mode == 'full-release' }}
        run: npm run build

      - name: Create and sync Android project
        if: ${{ inputs.run_mode == 'full-release' }}
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          npm run android:prepare

      - name: Validate Android signing secrets
        if: ${{ inputs.run_mode == 'full-release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then echo "::error::$key belum diisi."; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bumi-makmur-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/bumi-makmur-upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK and AAB
        if: ${{ inputs.run_mode == 'full-release' }}
        working-directory: android
        env:
          BM_KEYSTORE_PATH: ${{ runner.temp }}/bumi-makmur-upload.jks
          BM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Verify APK signature
        if: ${{ inputs.run_mode == 'full-release' }}
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" android/app/build/outputs/bundle/release/app-release.aab > SHA256SUMS.txt

      - name: Upload signed Android release
        if: ${{ inputs.run_mode == 'full-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: Bumi-Makmur-POS-Hybrid-v4.2-signed-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
