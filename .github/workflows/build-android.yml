name: Build Bumi Makmur POS v4.5.1

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Pilih jenis build
        required: true
        default: test-only
        type: choice
        options:
          - test-only
          - web-only
          - android-release
          - web-and-android

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run core tests
        run: npm run test:core

      - name: Run static audit
        run: npm run audit:static

      - name: Compile web source in test-only mode
        if: ${{ inputs.run_mode == 'test-only' }}
        run: npm run build

      - name: Stop after tests and web compilation
        if: ${{ inputs.run_mode == 'test-only' }}
        run: echo "Core tests, audit statis, dan kompilasi Vite lulus. Tidak membuat APK."

      - name: Validate Firebase web configuration
        if: ${{ inputs.run_mode != 'test-only' }}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORE_ID: ${{ secrets.VITE_FIREBASE_STORE_ID }}
          VITE_FIREBASE_STORE_CODE: ${{ secrets.VITE_FIREBASE_STORE_CODE }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID
            VITE_FIREBASE_STORE_ID VITE_FIREBASE_STORE_CODE
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key belum diisi pada GitHub Secrets."
              exit 1
            fi
          done
          cat > .env.production <<ENVFILE
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_FIREBASE_STORE_ID=$VITE_FIREBASE_STORE_ID
          VITE_FIREBASE_STORE_CODE=$VITE_FIREBASE_STORE_CODE
          VITE_PUBLIC_APP_URL=$VITE_PUBLIC_APP_URL
          ENVFILE

      - name: Build web and PC PWA
        if: ${{ inputs.run_mode != 'test-only' }}
        run: npm run build

      - name: Upload Web and PC PWA
        if: ${{ inputs.run_mode == 'web-only' || inputs.run_mode == 'web-and-android' }}
        uses: actions/upload-artifact@v6
        with:
          name: Bumi-Makmur-POS-v4.5.1-Web-PC-PWA
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Setup Java
        if: ${{ inputs.run_mode == 'android-release' || inputs.run_mode == 'web-and-android' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create Android project
        if: ${{ inputs.run_mode == 'android-release' || inputs.run_mode == 'web-and-android' }}
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          npm run android:prepare

      - name: Validate Android signing secrets
        if: ${{ inputs.run_mode == 'android-release' || inputs.run_mode == 'web-and-android' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then echo "::error::$key belum diisi."; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bumi-makmur-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/bumi-makmur-upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed APK and AAB
        if: ${{ inputs.run_mode == 'android-release' || inputs.run_mode == 'web-and-android' }}
        working-directory: android
        env:
          BM_KEYSTORE_PATH: ${{ runner.temp }}/bumi-makmur-upload.jks
          BM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Verify release signature
        if: ${{ inputs.run_mode == 'android-release' || inputs.run_mode == 'web-and-android' }}
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" android/app/build/outputs/bundle/release/app-release.aab > SHA256SUMS.txt

      - name: Upload signed Android release
        if: ${{ inputs.run_mode == 'android-release' || inputs.run_mode == 'web-and-android' }}
        uses: actions/upload-artifact@v6
        with:
          name: Bumi-Makmur-POS-v4.5.1-Android-Signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
